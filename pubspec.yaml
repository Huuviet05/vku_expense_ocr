name: vku_expense_ocr
description: VKU On-Device OCR Expense Tracker — Mini Project 3
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # OCR & Camera
  google_mlkit_text_recognition: ^0.11.0
  image_picker: ^1.0.7

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Persistence
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3

  # UI
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
